name: Terraform module validation

on:
  pull_request:
    paths:
      - "modules/**"
      - "*.tf"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "*.tf"

permissions:
  contents: read

jobs:
  validate-aks-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Initialize AKS module without a backend
        run: terraform -chdir=modules/aks init -backend=false -input=false

      - name: Validate AKS module
        run: terraform -chdir=modules/aks validate
